<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RizzAI - Panel de Control</title>
    <style>
        body { background-color: #0b0816; color: #f3f0ff; font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        h1 { color: #ff2e93; text-align: center; margin-bottom: 20px; }
        .card { background: #18142c; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        label { display: block; font-size: 0.8rem; color: #8b85b1; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; background: #0f0c1b; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; margin-bottom: 12px; box-sizing: border-box; }
        button { width: 100%; background: linear-gradient(90deg, #ff2e93, #e01b76); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .code-item { display: flex; justify-content: space-between; align-items: center; background: #0f0c1b; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .btn-delete { width: auto; background: #ff3333; padding: 5px 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <h1>Panel de Administración</h1>
    
    <div class="card">
        <label>Contraseña Maestra</label>
        <input type="password" id="admin-pass" value="MiClaveSuperSecreta123">
        <button onclick="cargarCupones()">🔐 Conectar con Servidor</button>
    </div>

    <div class="card">
        <h3>Crear Cupón</h3>
        <label>Código (Ej: YOUTUBE50)</label>
        <input type="text" id="new-name" placeholder="Ej: PROMOVIP">
        <label>Días Premium</label>
        <input type="number" id="new-days" value="7">
        <label>Créditos de Regalo</label>
        <input type="number" id="new-credits" value="0">
        <button onclick="crearCupon()" style="background: #00f0ff; color: black;">Crear Nuevo Código</button>
    </div>

    <div class="card">
        <h3>Códigos Vigentes</h3>
        <div id="lista-cupones">Conecta el servidor para listar cupones.</div>
    </div>

    <script>
        // 🚨 CONFIGURA TU URL DE RENDER AQUÍ TAMBIÉN 🚨
        const BACKEND_URL = "https://rizzfree.onrender.com";

        async function cargarCupones() {
            const password = document.getElementById('admin-pass').value;
            const container = document.getElementById('lista-cupones');
            container.innerHTML = "Sincronizando...";

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/list`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (!res.ok) return container.innerHTML = `<span style="color:red">${data.error}</span>`;
                
                container.innerHTML = "";
                Object.keys(data).forEach(key => {
                    container.innerHTML += `
                        <div class="code-item">
                            <div>
                                <b style="color:#00f0ff">${key}</b><br>
                                <small style="color:#8b85b1">Premium: ${data[key].diasPremium}d | Créditos: ${data[key].creditosRegalo}</small>
                            </div>
                            <button class="btn-delete" onclick="eliminarCupon('${key}')">Borrar</button>
                        </div>
                    `;
                });
            } catch (e) { container.innerHTML = "Error al conectar."; }
        }

        async function crearCupon() {
            const password = document.getElementById('admin-pass').value;
            const nombreCodigo = document.getElementById('new-name').value;
            const diasPremium = document.getElementById('new-days').value;
            const creditosRegalo = document.getElementById('new-credits').value;

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, nombreCodigo, diasPremium, creditosRegalo })
                });
                const data = await res.json();
                alert(data.mensaje || data.error);
                if (res.ok) { document.getElementById('new-name').value = ""; cargarCupones(); }
            } catch(e) { alert("Error."); }
        }

        async function eliminarCupon(nombreCodigo) {
            if (!confirm(`¿Borrar código ${nombreCodigo}?`)) return;
            const password = document.getElementById('admin-pass').value;

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/delete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, nombreCodigo })
                });
                const data = await res.json();
                alert(data.mensaje || data.error);
                if (res.ok) cargarCupones();
            } catch(e) { alert("Error."); }
        }
    </script>
</body>
</html>
